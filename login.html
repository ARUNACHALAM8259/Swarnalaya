<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in - Swarnalaya</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
      }

      .signin-container {
        width: 100%;
        max-width: 400px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo-wrapper {
        margin-bottom: 35px;
      }

      .logo-img {
        max-width: 260px;
        height: auto;
        object-fit: contain;
      }

      .signin-title {
        font-size: 42px;
        font-weight: 500;
        color: #333333;
        margin-bottom: 45px;
        letter-spacing: 0.5px;
        transition: opacity 0.25s ease;
      }

      .signin-title .highlight {
        color: #137b7a; /* Teal Swarnalaya theme color */
        font-weight: 600;
      }

      .form-wrapper {
        width: 100%;
      }

      .input-group {
        width: 100%;
        margin-bottom: 25px;
        position: relative;
      }

      .mobile-input-wrapper {
        display: flex;
        align-items: center;
        background-color: #ededed;
        border-radius: 12px;
        border: 2px solid transparent;
        overflow: hidden;
        transition: all 0.25s ease;
      }

      .mobile-input-wrapper:focus-within {
        background-color: #e5e5e5;
        border-color: rgba(19, 123, 122, 0.3);
      }

      .country-code {
        padding: 0 10px 0 20px;
        font-size: 17px;
        color: #555555;
        font-weight: 600;
        border-right: 1px solid #dcdcdc;
        height: 24px;
        display: flex;
        align-items: center;
      }

      .form-input {
        width: 100%;
        height: 56px;
        background-color: #ededed;
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 0 20px;
        font-size: 17px;
        color: #333333;
        outline: none;
        transition: all 0.25s ease;
      }

      .mobile-input-wrapper .form-input {
        background-color: transparent;
        border: none;
        border-radius: 0;
        padding-left: 20px;
      }

      .form-input::placeholder {
        color: #7f7f7f;
      }

      .form-input:focus {
        background-color: #e5e5e5;
        border-color: rgba(19, 123, 122, 0.3);
      }

      .error-text {
        color: #d93025;
        font-size: 13px;
        font-weight: 500;
        text-align: left;
        margin-top: 6px;
        padding-left: 5px;
        display: none;
        line-height: 1.4;
      }

      .input-group.has-error .form-input,
      .input-group.has-error .mobile-input-wrapper {
        border-color: #d93025;
        background-color: #fce8e6;
      }

      .input-group.has-error .error-text {
        display: block;
      }



      /* OTP Resend Timer Styles */
      .otp-timer-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        padding: 0 5px;
      }

      .timer-text {
        font-size: 14px;
        color: #666666;
        font-weight: 500;
      }

      .resend-btn {
        background: none;
        border: none;
        color: #137b7a;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        outline: none;
        transition: color 0.2s ease;
      }

      .resend-btn:hover {
        color: #0f6261;
        text-decoration: underline;
      }

      .resend-btn:disabled {
        color: #b0b0b0;
        cursor: not-allowed;
        text-decoration: none;
      }

      .submit-btn {
        width: 100%;
        height: 52px;
        background-color: #137b7a; /* Rounded teal button */
        color: #ffffff;
        border: none;
        border-radius: 26px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 4px 12px rgba(19, 123, 122, 0.2);
        letter-spacing: 0.5px;
        margin-top: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .submit-btn:hover {
        background-color: #0f6261;
        box-shadow: 0 6px 16px rgba(19, 123, 122, 0.3);
        transform: translateY(-1px);
      }

      .submit-btn:active {
        transform: translateY(1px);
      }

      /* Loading Spinner Styles */
      .spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #ffffff;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .submit-btn.loading .spinner {
        display: block;
      }
      .submit-btn.loading .btn-text {
        opacity: 0.8;
      }

      .toggle-auth-mode {
        display: inline-block;
        color: #137b7a;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        margin-top: 25px;
        transition: color 0.2s ease;
      }

      .toggle-auth-mode:hover {
        color: #0f6261;
        text-decoration: underline;
      }

      .back-to-shop {
        margin-top: 40px;
        display: inline-block;
        color: #7f7f7f;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      .back-to-shop:hover {
        color: #333333;
      }

      .back-to-shop i {
        margin-right: 6px;
      }

      /* Password input styles with eye toggle */
      .password-wrapper {
        position: relative;
        width: 100%;
      }

      .password-toggle-btn {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #7f7f7f;
        cursor: pointer;
        outline: none;
        font-size: 18px;
        transition: color 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .password-toggle-btn:hover {
        color: #137b7a;
      }

      /* Alert banners for feedback */
      .success-alert {
        display: none;
        background-color: #e6f4ea;
        border: 1px solid #137333;
        color: #137333;
        padding: 14px 18px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 15px;
        text-align: left;
        line-height: 1.4;
      }

      .error-alert {
        display: none;
        background-color: #fce8e6;
        border: 1px solid #d93025;
        color: #c5221f;
        padding: 14px 18px;
        border-radius: 12px;
        margin-bottom: 20px;
        font-size: 15px;
        text-align: left;
        line-height: 1.4;
      }

      /* Align forgot password to the right */
      .forgot-password-link {
        display: block;
        font-size: 14px;
        color: #666666;
        text-decoration: none;
        margin-top: -15px;
        margin-bottom: 25px;
        text-align: right;
        font-weight: 500;
        transition: color 0.2s ease;
      }
      
      .forgot-password-link:hover {
        color: #137b7a;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="signin-container">
      <!-- Logo -->
      <div class="logo-wrapper">
        <a href="index.html">
          <img src="logo.png" alt="Swarnalaya Logo" class="logo-img" />
        </a>
      </div>

      <!-- Title -->
      <h1 class="signin-title" id="authTitle"><span class="highlight">S</span>ign In</h1>

      <!-- Success Message Alert -->
      <div id="successAlert" class="success-alert">
        <i class="fas fa-check-circle" style="margin-right: 8px;"></i>
        <span id="successAlertText">Password reset link sent! Please check your email.</span>
      </div>

      <!-- General Error Alert -->
      <div id="errorAlert" class="error-alert">
        <div>
          <i class="fas fa-exclamation-circle" style="margin-right: 8px;"></i>
          <span id="errorAlertText">Error message here</span>
        </div>
        <button type="button" id="demoFallbackBtn" style="display: none; background-color: #ffffff; color: #c5221f; border: 1px solid #d93025; padding: 8px 14px; border-radius: 20px; margin-top: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; width: 100%; text-align: center; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); outline: none;">
          <i class="fas fa-magic" style="margin-right: 6px;"></i> Sign In via Demo Mode
        </button>
      </div>

      <!-- MSG91 Widget Container (Hidden by default, shown if widgetId is configured) -->
      <div id="msg91-otp-widget-container" style="display: none; width: 100%; min-height: 250px; margin-bottom: 25px;"></div>

      <!-- Main Form Wrapper -->
      <form class="form-wrapper" id="authForm" action="#" method="POST" novalidate>
        
        <!-- Name Input Group (SignUp only) -->
        <div class="input-group" id="nameInputGroup" style="display: none;">
          <input
            type="text"
            class="form-input"
            placeholder="Full Name"
            id="signUpName"
            required
          />
          <div class="error-text" id="nameErrorMsg">Please enter your full name</div>
        </div>

        <!-- Email Input Group (SignUp only) -->
        <div class="input-group" id="emailInputGroup" style="display: none;">
          <input
            type="email"
            class="form-input"
            placeholder="Email Address"
            id="signUpEmail"
            required
          />
          <div class="error-text" id="emailErrorMsg">Please enter a valid email address</div>
        </div>

        <!-- Mobile Input Group -->
        <div class="input-group" id="mobileInputGroup">
          <div class="mobile-input-wrapper">
            <span class="country-code">+91</span>
            <input
              type="tel"
              class="form-input"
              placeholder="Mobile Number"
              id="mobileInput"
              pattern="[0-9]{10}"
              maxlength="10"
              required
            />
          </div>
          <div class="error-text" id="mobileErrorMsg">Please enter a valid 10-digit mobile number</div>
        </div>

        <!-- OTP Input Group (Initially Hidden) -->
        <div class="input-group" id="otpInputGroup" style="display: none;">
          <input
            type="text"
            class="form-input"
            placeholder="Enter 6-Digit OTP"
            id="otpInput"
            pattern="[0-9]{6}"
            maxlength="6"
            required
          />
          <div class="error-text" id="otpErrorMsg">Please enter a valid 6-digit OTP code</div>
          <!-- OTP timer/resend -->
          <div class="otp-timer-container">
            <span class="timer-text" id="otpTimerText">Resend OTP in 30s</span>
            <button type="button" class="resend-btn" id="resendOtpBtn" disabled>Resend OTP</button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submitBtn">
          <div class="spinner"></div>
          <span class="btn-text" id="submitBtnText">Send OTP</span>
        </button>

        <!-- Toggle Auth Mode -->
        <div style="margin-top: 25px;">
          <a href="#" class="toggle-auth-mode" id="toggleAuthModeBtn">Don't have an account? Sign Up</a>
        </div>

      </form>

      <!-- Back link -->
      <a href="index.html" class="back-to-shop">
        <i class="fas fa-arrow-left"></i> Back to shop
      </a>
    </div>

    <script>
      // Auto redirect to homepage if already logged in
      if (localStorage.getItem("swarnalaya_auth_user")) {
        window.location.href = "index.html";
      }

      // DOM Elements
      const authTitle = document.getElementById("authTitle");
      const authForm = document.getElementById("authForm");
      const widgetContainer = document.getElementById("msg91-otp-widget-container");
      
      const nameInputGroup = document.getElementById("nameInputGroup");
      const signUpName = document.getElementById("signUpName");
      const nameErrorMsg = document.getElementById("nameErrorMsg");
      
      const emailInputGroup = document.getElementById("emailInputGroup");
      const signUpEmail = document.getElementById("signUpEmail");
      const emailErrorMsg = document.getElementById("emailErrorMsg");
      
      const mobileInput = document.getElementById("mobileInput");
      const mobileInputGroup = document.getElementById("mobileInputGroup");
      const mobileErrorMsg = document.getElementById("mobileErrorMsg");
      
      const otpInputGroup = document.getElementById("otpInputGroup");
      const otpInput = document.getElementById("otpInput");
      const otpErrorMsg = document.getElementById("otpErrorMsg");
      
      const otpTimerText = document.getElementById("otpTimerText");
      const resendOtpBtn = document.getElementById("resendOtpBtn");
      
      const submitBtn = document.getElementById("submitBtn");
      const submitBtnText = document.getElementById("submitBtnText");
      
      const toggleAuthModeBtn = document.getElementById("toggleAuthModeBtn");
      
      const successAlert = document.getElementById("successAlert");
      const successAlertText = document.getElementById("successAlertText");
      const errorAlert = document.getElementById("errorAlert");
      const errorAlertText = document.getElementById("errorAlertText");
      const demoFallbackBtn = document.getElementById("demoFallbackBtn");

      // State
      let authMode = "signin"; // 'signin' or 'signup'
      let otpSent = false;
      let timerInterval = null;

      // Mobile Validator
      function isValidMobile(mobile) {
        return /^[6-9]\d{9}$/.test(mobile);
      }

      // Email Validator
      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      // Hide alerts
      function hideAlerts() {
        successAlert.style.display = "none";
        errorAlert.style.display = "none";
        demoFallbackBtn.style.display = "none";
      }

      // Display Alert functions
      function showError(message) {
        errorAlertText.textContent = message;
        errorAlert.style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Display Success functions
      function showSuccess(message) {
        successAlertText.textContent = message;
        successAlert.style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Timer for Resend OTP
      function startResendTimer() {
        clearInterval(timerInterval);
        resendOtpBtn.disabled = true;
        let timeLeft = 30;
        otpTimerText.textContent = `Resend OTP in ${timeLeft}s`;
        
        timerInterval = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            otpTimerText.textContent = "";
            resendOtpBtn.disabled = false;
          } else {
            otpTimerText.textContent = `Resend OTP in ${timeLeft}s`;
          }
        }, 1000);
      }

      // Set Authentication Mode UI State
      function setAuthMode(mode) {
        authMode = mode;
        otpSent = false;
        clearInterval(timerInterval);
        hideAlerts();
        
        // Reset disabled states
        signUpName.disabled = false;
        signUpEmail.disabled = false;
        mobileInput.disabled = false;
        
        // Reset inputs
        signUpName.value = "";
        signUpEmail.value = "";
        mobileInput.value = "";
        otpInput.value = "";
        
        // Reset validation styling
        nameInputGroup.classList.remove("has-error");
        emailInputGroup.classList.remove("has-error");
        mobileInputGroup.classList.remove("has-error");
        otpInputGroup.classList.remove("has-error");
        
        otpInputGroup.style.display = "none";
        
        authTitle.style.opacity = "0";
        
        setTimeout(() => {
          if (authMode === "signin") {
            authTitle.innerHTML = '<span class="highlight">S</span>ign In';
            nameInputGroup.style.display = "none";
            emailInputGroup.style.display = "none";
            submitBtnText.textContent = "Send OTP";
            toggleAuthModeBtn.textContent = "Don't have an account? Sign Up";
          } else if (authMode === "signup") {
            authTitle.innerHTML = '<span class="highlight">S</span>ign Up';
            nameInputGroup.style.display = "block";
            emailInputGroup.style.display = "block";
            submitBtnText.textContent = "Send OTP";
            toggleAuthModeBtn.textContent = "Already have an account? Sign In";
          }
          authTitle.style.opacity = "1";
        }, 150);
      }

      // Event listener to toggle between modes
      toggleAuthModeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (authMode === "signin") {
          setAuthMode("signup");
        } else {
          setAuthMode("signin");
        }
      });

      // Resend OTP Action
      resendOtpBtn.addEventListener("click", async () => {
        submitBtn.classList.add("loading");
        submitBtn.disabled = true;
        hideAlerts();

        const mobile = mobileInput.value.trim();
        try {
          const response = await fetch("/api/otp/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mobile: mobile,
              countryCode: "91"
            })
          });

          const resData = await response.json();
          if (!response.ok) {
            throw new Error(resData.error || "Failed to resend OTP");
          }

          showSuccess("OTP resent successfully!");
          startResendTimer();
        } catch (err) {
          console.error("Resend OTP error:", err);
          showError("Failed to resend OTP: " + err.message);
        } finally {
          submitBtn.classList.remove("loading");
          submitBtn.disabled = false;
        }
      });

      // Verify Access Token via Backend verify-msg91 Endpoint
      async function verifyMsg91Token(token) {
        submitBtn.classList.add("loading");
        submitBtn.disabled = true;
        hideAlerts();
        
        const name = signUpName.value.trim();
        const email = signUpEmail.value.trim();
        
        try {
          const response = await fetch("/api/auth/verify-msg91", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              "access-token": token,
              name: name,
              email: email,
              authMode: authMode
            })
          });

          const resData = await response.json();
          if (!response.ok) {
            throw new Error(resData.error || "Token verification failed");
          }

          const loggedUser = resData.user || { name: name || "Swarnalaya Customer" };

          // Store auth state
          localStorage.setItem("swarnalaya_auth_user", JSON.stringify({
            name: loggedUser.name,
            email: loggedUser.email,
            phone: loggedUser.mobile,
            uid: "msg91-uid-" + Math.random().toString(36).substring(2, 9),
            method: "msg91"
          }));

          showSuccess("Verification successful! Redirecting...");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        } catch (error) {
          console.error("OTP token verification error:", error);
          showError(error.message || "Invalid OTP token. Please try again.");
        } finally {
          submitBtn.classList.remove("loading");
          submitBtn.disabled = false;
        }
      }

      // Form submission validation & action (Demo Mode Fallback)
      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlerts();
        
        const name = signUpName.value.trim();
        const email = signUpEmail.value.trim();
        const mobile = mobileInput.value.trim();
        const otp = otpInput.value.trim();
        
        nameInputGroup.classList.remove("has-error");
        emailInputGroup.classList.remove("has-error");
        mobileInputGroup.classList.remove("has-error");
        otpInputGroup.classList.remove("has-error");

        if (!otpSent) {
          // PHASE 1: Send OTP
          let hasError = false;

          if (authMode === "signup") {
            if (!name) {
              nameInputGroup.classList.add("has-error");
              hasError = true;
            }
            if (!isValidEmail(email)) {
              emailInputGroup.classList.add("has-error");
              hasError = true;
            }
          }
          
          if (!isValidMobile(mobile)) {
            mobileInputGroup.classList.add("has-error");
            hasError = true;
          }

          if (hasError) return;

          submitBtn.classList.add("loading");
          submitBtn.disabled = true;

          try {
            const response = await fetch("/api/otp/send", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                mobile: mobile,
                countryCode: "91"
              })
            });

            const resData = await response.json();
            if (!response.ok) {
              throw new Error(resData.error || "Failed to send OTP");
            }
            
            otpSent = true;
            showSuccess("OTP sent to your mobile number +91 " + mobile);
            
            // Disable initial fields
            signUpName.disabled = true;
            signUpEmail.disabled = true;
            mobileInput.disabled = true;
            
            // Show OTP field
            otpInputGroup.style.display = "block";
            submitBtnText.textContent = authMode === "signup" ? "Verify & Sign Up" : "Verify & Sign In";
            
            startResendTimer();
          } catch (error) {
            console.error("Send OTP error:", error);
            showError("Failed to send OTP: " + error.message);
          } finally {
            submitBtn.classList.remove("loading");
            submitBtn.disabled = false;
          }
        } else {
          // PHASE 2: Verify OTP
          if (!/^\d{6}$/.test(otp)) {
            otpInputGroup.classList.add("has-error");
            showError("Please enter a valid 6-digit OTP code");
            return;
          }

          // Build simulated access token for backend validation
          const mockToken = `demo-token-${mobile}-${otp}`;
          verifyMsg91Token(mockToken);
        }
      });

      // Clear errors on typing
      signUpName.addEventListener("input", () => nameInputGroup.classList.remove("has-error"));
      signUpEmail.addEventListener("input", () => emailInputGroup.classList.remove("has-error"));
      mobileInput.addEventListener("input", () => mobileInputGroup.classList.remove("has-error"));
      otpInput.addEventListener("input", () => otpInputGroup.classList.remove("has-error"));

      // Check config for MSG91 Widget ID on page load
      async function initAuth() {
        try {
          const res = await fetch("/api/config");
          const config = await res.json();
          
          if (config.widgetId) {
            console.log("MSG91 Widget ID configured:", config.widgetId);
            authForm.style.display = "none";
            widgetContainer.style.display = "block";
            
            // Load MSG91 script dynamically
            const script = document.createElement("script");
            script.src = "https://control.msg91.com/app/assets/otp-provider/otp-provider.js";
            script.onload = () => {
              const widgetConfig = {
                widgetId: config.widgetId,
                tokenAuth: "1", // response type: 1 for access token (JWT), 0 for reqId
                success: (data) => {
                  console.log("MSG91 success callback:", data);
                  if (data && data.token) {
                    verifyMsg91Token(data.token);
                  }
                },
                failure: (error) => {
                  console.error("MSG91 failure callback:", error);
                  showError("Authentication failed: " + (error.message || "Invalid OTP code"));
                }
              };
              
              if (window.initSendOTP) {
                window.initSendOTP(widgetConfig);
              } else {
                console.error("initSendOTP not found on window");
                widgetContainer.style.display = "none";
                authForm.style.display = "block";
              }
            };
            script.onerror = () => {
              console.error("Failed to load MSG91 script, falling back to Demo Mode");
              widgetContainer.style.display = "none";
              authForm.style.display = "block";
            };
            document.head.appendChild(script);
          } else {
            console.log("MSG91 Widget ID not configured. Running in Demo Mode.");
            widgetContainer.style.display = "none";
            authForm.style.display = "block";
          }
        } catch (e) {
          console.error("Error loading config, falling back to Demo Mode", e);
          widgetContainer.style.display = "none";
          authForm.style.display = "block";
        }
      }

      initAuth();
    </script>
  </body>
</html>
